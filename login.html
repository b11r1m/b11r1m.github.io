<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login / Register</title>
<style>
body {
  margin: 0;
  padding: 0;
  font-family: 'Segoe UI', sans-serif;
  background: #e0e5ec;
  display: flex;
  justify-content: center;
  align-items: center;
  height: 100vh;
}

.container {
  background: #e0e5ec;
  padding: 30px;
  border-radius: 20px;
  box-shadow: 10px 10px 30px #c2c8d0, -10px -10px 30px #ffffff;
  width: 300px;
}

.tabs {
  display: flex;
  justify-content: space-between;
  margin-bottom: 20px;
}

.tabs button {
  flex: 1;
  padding: 10px;
  border: none;
  background: none;
  font-weight: bold;
  cursor: pointer;
  border-radius: 10px;
  transition: 0.3s;
}

.tabs button.active {
  background: #d1d9e6;
  box-shadow: inset 2px 2px 5px #bec4cb, inset -2px -2px 5px #f0f5fa;
}

.form {
  display: none;
  flex-direction: column;
}

.form.active {
  display: flex;
}

input {
  margin: 10px 0;
  padding: 12px;
  border-radius: 10px;
  border: none;
  background: #e0e5ec;
  box-shadow: inset 4px 4px 6px #c8ccd1, inset -4px -4px 6px #f0f5fa;
}

.btn {
  margin-top: 10px;
  padding: 12px;
  background: #e0e5ec;
  border: none;
  border-radius: 10px;
  cursor: pointer;
  font-weight: bold;
  box-shadow: 6px 6px 10px #c2c8d0, -6px -6px 10px #ffffff;
  transition: 0.3s;
}

.btn:hover {
  background: #d6dce4;
}

.message {
  text-align: center;
  margin-top: 8px;
  font-size: 0.9em;
}

.success {
  color: green;
}

.error {
  color: red;
}

.or {
  text-align: center;
  margin: 15px 0 10px;
  font-size: 0.85em;
  color: #666;
}

.socials {
  display: flex;
  justify-content: space-around;
}

.social {
  width: 40px;
  height: 40px;
  border-radius: 50%;
  border: none;
  background: #e0e5ec;
  box-shadow: 6px 6px 10px #c2c8d0, -6px -6px 10px #ffffff;
  font-size: 1.2em;
  cursor: pointer;
}
</style>
</head>
<body>
<div class="container">
  <div class="tabs">
    <button id="loginTab" class="active">Login</button>
    <button id="registerTab">Register</button>
  </div>

  <!-- Login Form -->
  <form id="loginForm" class="form active">
    <input id="loginEmail" type="email" placeholder="Email" required />
    <input id="loginPassword" type="password" placeholder="Password" required />
    <button type="submit" class="btn">Login</button>
    <p class="message" id="loginMessage"></p>
  </form>

  <!-- Register Form -->
  <form id="registerForm" class="form">
    <input id="regName" type="text" placeholder="Full Name" required />
    <input id="regEmail" type="email" placeholder="Email" required />
    <input id="regPassword" type="password" placeholder="Password" required />
    <input id="regConfirm" type="password" placeholder="Confirm Password" required />
    <button type="submit" class="btn">Register</button>
    <p class="message" id="registerMessage"></p>
  </form>
</div>

<script>
const loginTab = document.getElementById("loginTab");
const registerTab = document.getElementById("registerTab");
const loginForm = document.getElementById("loginForm");
const registerForm = document.getElementById("registerForm");

loginTab.addEventListener("click", () => {
  loginTab.classList.add("active");
  registerTab.classList.remove("active");
  loginForm.classList.add("active");
  registerForm.classList.remove("active");
});

registerTab.addEventListener("click", () => {
  registerTab.classList.add("active");
  loginTab.classList.remove("active");
  registerForm.classList.add("active");
  loginForm.classList.remove("active");
});

// LocalStorage helper
function getUsers() {
  return JSON.parse(localStorage.getItem("users") || "[]");
}

function saveUsers(users) {
  localStorage.setItem("users", JSON.stringify(users));
}

// Register form
registerForm.addEventListener("submit", e => {
  e.preventDefault();
  const name = document.getElementById("regName").value.trim();
  const email = document.getElementById("regEmail").value.trim();
  const pass = document.getElementById("regPassword").value;
  const confirm = document.getElementById("regConfirm").value;
  const msg = document.getElementById("registerMessage");
  msg.textContent = "";

  if (pass !== confirm) {
    msg.textContent = "Passwords do not match!";
    msg.className = "message error";
    return;
  }

  const users = getUsers();
  if (users.find(u => u.email === email)) {
    msg.textContent = "Email already registered!";
    msg.className = "message error";
    return;
  }

  users.push({ name, email, pass });
  saveUsers(users);

  msg.textContent = "Registration successful!";
  msg.className = "message success";
  registerForm.reset();

  // Switch to login tab automatically
  setTimeout(() => {
    loginTab.click();
  }, 1000);
});

// Login form
loginForm.addEventListener("submit", e => {
  e.preventDefault();
  const email = document.getElementById("loginEmail").value.trim();
  const pass = document.getElementById("loginPassword").value;
  const msg = document.getElementById("loginMessage");
  msg.textContent = "";

  const users = getUsers();
  const user = users.find(u => u.email === email && u.pass === pass);

  if (!user) {
    msg.textContent = "Invalid email or password!";
    msg.className = "message error";
    return;
  }

  msg.textContent = "Login successful! Redirecting...";
  msg.className = "message success";

  // Simulate redirect (to IQ test or dashboard)
  setTimeout(() => {
    window.location.href = "quiz.html"; // You can change this
  }, 1000);
});
</script>
</body>
</html>
